# slang.yaml — Sense disambiguation examples for bert_filter.py
#
# Each entry provides example sentences for the slang usage and the
# standard/literal usage of the word or phrase.  The BERT classifier
# uses these to build prototype embeddings; more examples per sense
# produce more stable prototypes.
#
# Note that in current experiments, to simplify sampling logic,
# we do not use multi-word slang phrases, they are presented here for potenential future work and reference.

